<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detalle de campaña · Portal OBP</title>
<style>
  :root {
    --bg-canvas: #f7f8fa;
    --bg-surface: #ffffff;
    --bg-brand-soft: #f1f4fe;
    --brand: #3658c1;
    --brand-hover: #3251b1;
    --brand-pressed: #2d49a1;
    --text-brand: #2d49a1;
    --text-link: #3251b1;
    --text-primary: #313336;
    --text-secondary: #585a5e;
    --text-tertiary: #6c6e73;
    --border-default: #c6c8cc;
    --border-subtle: #d4d6d9;
    --success: #22c55e;
    --warning: #eab308;
    --danger: #ef4444;
    --danger-text: #b83434;
    --info: #06b6d4;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 1px 2px rgba(20, 24, 40, .06), 0 1px 3px rgba(20, 24, 40, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-canvas: #111318;
      --bg-surface: #1a1d24;
      --bg-brand-soft: #222a47;
      --brand: #5b7be0;
      --brand-hover: #6d8ae6;
      --brand-pressed: #4a68d0;
      --text-brand: #a9bcf5;
      --text-link: #a9bcf5;
      --text-primary: #eceef2;
      --text-secondary: #b9bcc4;
      --text-tertiary: #9a9da6;
      --border-default: #4a4e58;
      --border-subtle: #2e323b;
      --danger-text: #f08a8a;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  :root[data-theme="dark"] {
    --bg-canvas: #111318;
    --bg-surface: #1a1d24;
    --bg-brand-soft: #222a47;
    --brand: #5b7be0;
    --brand-hover: #6d8ae6;
    --brand-pressed: #4a68d0;
    --text-brand: #a9bcf5;
    --text-link: #a9bcf5;
    --text-primary: #eceef2;
    --text-secondary: #b9bcc4;
    --text-tertiary: #9a9da6;
    --border-default: #4a4e58;
    --border-subtle: #2e323b;
    --danger-text: #f08a8a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-canvas);
    color: var(--text-primary);
    font-family: "SF Pro Text", "SF Pro Display", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }
  button { font: inherit; cursor: pointer; }
  a { color: var(--text-link); }

  .app { min-height: 100vh; }

  /* Encabezado superior */
  .main { min-width: 0; }
  .topbar {
    height: 56px; width: 100%;
    display: flex; align-items: center; gap: 12px;
    padding: 0 28px;
    background: var(--bg-surface);
    border-bottom: 0.5px solid var(--border-subtle);
  }
  .topbar-brand { font-size: 15px; font-weight: 500; color: var(--text-primary); }
  .topbar .spacer { flex: 1; }
  .user-name { font-weight: 600; }
  .logout { color: var(--text-link); font-size: 13px; text-decoration: none; }
  .logout:hover { text-decoration: underline; }
  @media (max-width: 599px) {
    .topbar .user-name { display: none; }
  }
  .theme-toggle {
    background: none; border: 1px solid var(--border-default); color: var(--text-secondary);
    border-radius: var(--radius-sm); padding: 6px 10px;
  }

  /* Sin límite de ancho: el contenido ocupa todo el espacio disponible en pantallas grandes. */
  .app, .main { width: 100%; }
  .content { padding: 28px; max-width: none; width: 100%; }

  /* Breadcrumbs */
  .crumbs { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--text-tertiary); margin-bottom: 12px; flex-wrap: wrap; }
  .crumbs a { text-decoration: none; color: var(--text-link); }
  .crumbs a:hover { text-decoration: underline; }
  .crumbs span[aria-current="page"] { color: var(--text-secondary); }

  h1 { font-size: 26px; margin: 0; font-weight: 700; }
  h2 { font-size: 16px; margin: 0 0 10px; font-weight: 600; }

  /* Encabezado de campaña */
  .camp-head {
    background: var(--bg-surface); border: 1px solid var(--border-subtle);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px 20px; margin-bottom: 16px;
    display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap;
  }
  .camp-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .folio { font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; margin-top: 4px; }
  /* Datos de la campaña: lista vertical, etiqueta arriba y valor abajo. */
  .facts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin: 0; }
  .fact-label { font-size: 12px; color: var(--text-tertiary); font-weight: 500; }
  .fact-value { font-size: 14px; color: var(--text-primary); font-weight: 500; margin: 2px 0 0; overflow-wrap: anywhere; }

  /* Badges */
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
    border: 1px solid transparent; white-space: nowrap;
  }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .b-action { color: #8a5a00; background: #fdf6d6; }
  .b-brand { color: var(--text-brand); background: var(--bg-brand-soft); }
  .b-ok { color: #15733f; background: #e4f8ec; }
  .b-neutral { color: var(--text-secondary); background: var(--bg-canvas); border-color: var(--border-subtle); }
  .b-info { color: #08707f; background: #dff7fb; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .b-action { color: #f5d46b; background: #3a3112; }
    :root:not([data-theme="light"]) .b-ok { color: #7fe3a5; background: #15331f; }
    :root:not([data-theme="light"]) .b-info { color: #7fe6f5; background: #0f3a42; }
  }
  :root[data-theme="dark"] .b-action { color: #f5d46b; background: #3a3112; }
  :root[data-theme="dark"] .b-ok { color: #7fe3a5; background: #15331f; }
  :root[data-theme="dark"] .b-info { color: #7fe6f5; background: #0f3a42; }

  /* Botones */
  .cta {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 14px; border-radius: var(--radius-sm); border: 1px solid var(--brand);
    background: var(--brand); color: #fff; font-weight: 600; text-decoration: none; white-space: nowrap;
  }
  .cta:hover { background: var(--brand-hover); }
  .cta:active { background: var(--brand-pressed); }
  .cta.secondary { background: transparent; color: var(--text-brand); }
  .cta[aria-disabled="true"] { opacity: .5; pointer-events: none; }

  /* Layout: Fases a la izquierda (2fr); Datos y Arte apilados a la derecha (1fr, mín. 300px).
     El orden del DOM (Datos, Fases, Arte) es el orden en móvil. La segunda fila es 1fr para que
     la altura extra de Fases no separe Datos de Arte. */
  .grid {
    display: grid; gap: 16px; align-items: start;
    grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr);
    grid-template-rows: auto 1fr;
    grid-template-areas: "fases datos" "fases arte";
  }
  .area-datos { grid-area: datos; }
  .area-fases { grid-area: fases; }
  .area-arte { grid-area: arte; }
  .panel {
    background: var(--bg-surface); border: 1px solid var(--border-subtle);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px;
    min-width: 0;
  }

  .counter { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--text-secondary); margin-top: 12px; }
  .counter .cta { margin-left: auto; }
  .bar { flex: 1; height: 6px; background: var(--border-subtle); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--brand); }

  /* Fases */
  .phase-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .phase {
    display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
    padding: 12px 14px; border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
  }
  .phase.locked { color: var(--text-tertiary); background: var(--bg-canvas); }
  /* Fase activa: expandida, con el siguiente paso dentro de la fila (borde de marca y fondo suave). */
  .phase.current { border-left: 4px solid var(--brand); background: var(--bg-brand-soft); align-items: start; }
  .phase.current .badge { align-self: start; }
  .phase-next { grid-column: 2 / -1; min-width: 0; }
  .phase-next strong { color: var(--text-primary); }
  .phase-next p { margin: 4px 0 12px; color: var(--text-secondary); }
  .phase-num {
    width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    font-size: 12px; font-weight: 600; background: var(--bg-canvas); color: var(--text-secondary);
  }
  .phase.current .phase-num { background: var(--brand); color: #fff; }
  .phase.done .phase-num { background: var(--success); color: #fff; }
  .phase-title { font-weight: 600; }
  .phase-desc { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  .phase.locked .phase-desc { color: var(--text-tertiary); }
  .lock-note { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Arte de la campaña (carga simulada) */
  .dropzone {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    text-align: center; padding: 28px 16px;
    border: 2px dashed var(--border-default); border-radius: var(--radius-sm);
    background: var(--bg-canvas); color: var(--text-secondary); cursor: pointer;
  }
  .dropzone:hover, .dropzone.over { border-color: var(--brand); background: var(--bg-brand-soft); }
  .dropzone:focus-within { outline: 2px solid var(--brand); outline-offset: 2px; border-color: var(--brand); }
  .dz-title { font-weight: 600; color: var(--text-primary); }
  .dz-hint { font-size: 12px; color: var(--text-tertiary); }
  .art-error { color: var(--danger-text); font-size: 13px; margin: 10px 0 0; }
  .art-error:empty { display: none; }
  .upload-row { border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 12px 14px; }
  .upload-meta { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
  .upload-name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .upload-size { color: var(--text-tertiary); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .upload-status { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; color: var(--text-secondary); }
  .upload-status .bar > i { width: 0; }
  .art-done { display: grid; gap: 10px; justify-items: start; }
  #artPanel [hidden] { display: none; }
  .art-thumb { width: 100%; max-width: 320px; aspect-ratio: 16 / 9; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-subtle); }
  .art-thumb svg { display: block; width: 100%; height: 100%; }
  .art-note { font-size: 12px; color: var(--text-tertiary); margin: 0; }
  .art-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .art-file { font-size: 13px; color: var(--text-secondary); overflow-wrap: anywhere; }

  /* Mobile */
  @media (max-width: 900px) {
    .topbar { padding: 0 16px; }
    .content { padding: 20px 16px; }
    .grid {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: none;
      grid-template-areas: "datos" "fases" "arte";
    }
    h1 { font-size: 22px; }
  }
  @media (max-width: 560px) {
    .cta { width: 100%; }
    .counter { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>
<div class="app">
  <main class="main">
    <header class="topbar">
      <div class="topbar-brand">OBP · Clientes</div>
      <div class="spacer"></div>
      <button class="theme-toggle" id="themeBtn" aria-label="Cambiar tema">Tema</button>
      <span class="user-name"></span>
      <a class="logout" id="resetDatos" href="#" hidden>Restablecer datos</a>
      <a class="logout" href="login.html">Cerrar sesión</a>
    </header>

    <section class="content" id="content">
      <nav class="crumbs" aria-label="Ruta">
        <a href="mis-campanas.html">Mis campañas</a>
        <span aria-hidden="true">›</span>
        <span aria-current="page" id="crumbName"></span>
      </nav>

      <div class="camp-head">
        <div>
          <div class="camp-title">
            <h1 id="campName"></h1>
            <span class="badge" id="campBadge"></span>
          </div>
          <div class="folio" id="campCode"></div>
        </div>
        <a class="cta" id="headCta" href="#"></a>
      </div>

      <div class="grid">
        <div class="panel area-datos">
          <h2 id="factsTitle">Datos de la campaña</h2>
          <dl class="facts" aria-labelledby="factsTitle">
            <div>
              <dt class="fact-label">Agencia</dt>
              <dd class="fact-value" id="factAgencia"></dd>
            </div>
            <div>
              <dt class="fact-label">Vigencia</dt>
              <dd class="fact-value" id="factVigencia"></dd>
            </div>
            <div>
              <dt class="fact-label">Responsable comercial</dt>
              <dd class="fact-value">Por asignar</dd>
            </div>
            <div>
              <dt class="fact-label">Medios</dt>
              <dd class="fact-value" id="factMedios"></dd>
            </div>
          </dl>
        </div>

        <div class="panel area-fases">
          <h2 id="phasesTitle">Fases</h2>
          <ol class="phase-list" id="phases" aria-labelledby="phasesTitle"></ol>
        </div>

        <div class="panel area-arte" id="artPanel">
          <h2>Arte de la campaña</h2>
          <div id="artStatus" class="sr" aria-live="polite"></div>
          <div id="artEmpty">
            <label class="dropzone" id="artDrop" for="artInput">
              <span class="dz-title">Arrastra tu archivo o selecciónalo</span>
              <span class="dz-hint">PSD, AI, JPG o ZIP/RAR. Se guarda en el Drive de OBP.</span>
              <input class="sr" type="file" id="artInput" accept=".psd,.ai,.jpg,.jpeg,.zip,.rar">
            </label>
            <p class="art-error" id="artError" role="alert"></p>
          </div>
          <div class="upload-row" id="artUploading" hidden>
            <div class="upload-meta">
              <span class="upload-name" id="upName"></span>
              <span class="upload-size" id="upSize"></span>
            </div>
            <div class="upload-status">
              <span id="upText">Subiendo… 0%</span>
              <div class="bar" id="upBar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Progreso de carga del arte"><i id="upFill"></i></div>
            </div>
          </div>
          <div class="art-done" id="artDone" hidden>
            <span class="badge b-ok">Arte cargado</span>
            <div class="art-thumb" id="artThumb"></div>
            <p class="art-note">Almacenado en Drive de OBP (simulado).</p>
            <div class="art-file" id="artFile"></div>
            <div class="art-actions">
              <button type="button" class="cta secondary" id="artReplace">Reemplazar arte</button>
              <button type="button" class="cta secondary" id="artRemove">Quitar</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="datos.js"></script>
<script src="estado.js"></script>
<script>
  // Campaña según ?id (datos.js). Fases y bloqueos según docs/ARQUITECTURA_INFORMACION.md, secciones 1 y 2.
  obpPintarComun();
  // El cliente del portal es una agencia de publicidad.
  const AGENCIA = "Agencia de ejemplo Publicidad S.A.";
  document.querySelectorAll(".user-company").forEach((el) => { el.textContent = AGENCIA; });
  // Solo esta campaña recorre el flujo en la maqueta.
  const CAMP_FLUJO = "JRA-0021-ALPINA-ALPINA_LECHE-NOV-2026";
  // Estado guardado (estado.js) sobre los datos de ejemplo: estado siempre; respondidos, medios, instalados
  // y reportes solo si la campaña ya los trae (la semilla rellena con 0 / [] los que no aplican).
  // Si el estado cambió a "Cotización lista", el siguiente paso es la cotización (mismo texto que en datos.js).
  const ctaPorEstado = { "Cotización lista": "Ver cotización" };
  function conEstado(c) {
    const e = window.OBP_ESTADO && OBP_ESTADO.obtenerCampana(c.codigo);
    if (!e) return c;
    const r = Object.assign({}, c, { estado: e.estado || c.estado });
    ["respondidos", "medios", "instalados", "reportes"].forEach((k) => {
      if (c[k] !== undefined && e[k] !== undefined) r[k] = e[k];
    });
    if (r.estado !== c.estado && ctaPorEstado[r.estado]) r.nextCta = ctaPorEstado[r.estado];
    return r;
  }
  const campDatos = obpCampanaDeUrl();
  const camp = campDatos && conEstado(campDatos);
  const $id = (s) => document.getElementById(s);
  // Modo demo (estado.js): ?modo=demo lo activa y se recuerda; en maqueta no se guarda nada.
  const modoDemo = !!(window.OBP_ESTADO && OBP_ESTADO.modoDemo);

  if (!camp) {
    $id("content").innerHTML = `
      <nav class="crumbs" aria-label="Ruta">
        <a href="mis-campanas.html">Mis campañas</a>
      </nav>
      <div class="panel">
        <h1>Campaña no encontrada</h1>
        <p>No existe una campaña con ese código.</p>
        <p><a href="mis-campanas.html">Volver a Mis campañas</a></p>
      </div>`;
  } else {
    const q = `?id=${encodeURIComponent(camp.codigo)}`;
    const nivel = OBP_ESTADOS.indexOf(camp.estado);
    const desde = (estado) => nivel >= OBP_ESTADOS.indexOf(estado);
    const badgeClass = {
      "Propuesta lista": "b-action", "En selección": "b-action", "Cotización lista": "b-action",
      "Selección confirmada": "b-brand", "Aceptada": "b-brand",
      "En instalación": "b-info", "Instalada": "b-ok", "En reporte": "b-ok"
    };

    // Propuesta siempre disponible; el resto se desbloquea según el estado.
    // current = la fase en la que está la campaña; las fases desbloqueadas anteriores quedan como completadas.
    const fases = [
      { name: "Propuesta de medios", href: "propuesta-medios.html", desc: "Elige los medios que incluyes por tipo y ciudad.",
        open: true, current: !desde("Cotización lista"), lock: "" },
      { name: "Cotización", href: "cotizacion.html", desc: "Total con descuento e IVA, lista para aceptar.",
        open: desde("Cotización lista"), current: camp.estado === "Cotización lista", lock: "Se desbloquea al confirmar tu selección." },
      { name: "Instalación", href: "instalacion.html", desc: "Avance de instalación por medio.",
        open: desde("Aceptada"), current: camp.estado === "Aceptada" || camp.estado === "En instalación", lock: "Se desbloquea al aceptar la cotización." },
      { name: "Reportes", href: "reportes.html", desc: "Reportes fotográficos por periodo.",
        open: desde("Instalada"), current: desde("Instalada"), lock: "Se desbloquea cuando la campaña esté instalada." }
    ];
    // Fase activa: único lugar donde se decide. Si no se puede determinar, queda la 1 (índice 0).
    // Las filas se generan a partir de este índice: el siguiente paso se dibuja solo en esta fila.
    const iActiva = Math.max(0, fases.findIndex((f) => f.open && f.current));
    const faseActual = fases[iActiva];
    const faseClase = (i) => i === iActiva ? "current" : (i < iActiva && fases[i].open) ? "done" : "locked";
    const faseEstado = { current: "Pendiente", done: "Completada", locked: "Bloqueada" };
    const faseBadge = { current: "b-action", done: "b-ok", locked: "b-neutral" };
    const escTxt = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

    const reportes = camp.reportes || [];
    const pasos = {
      "Propuesta lista": ["Siguiente paso: responde la propuesta", 'Marca "¿Lo incluyes?" en cada medio. Confirmar selección se activa cuando respondas todos.'],
      "En selección": ["Siguiente paso: termina de responder la propuesta", "Guardaste cambios pero no confirmaste la selección."],
      "Selección confirmada": ["Estamos preparando tu cotización", "Te avisaremos cuando esté lista."],
      "Cotización lista": ["Siguiente paso: revisa la cotización", "Acepta la cotización para arrancar la campaña."],
      "Aceptada": ["Instalación en seguimiento", "Aceptaste la cotización. Aquí verás el avance de instalación."],
      "En instalación": ["Instalación en curso", `Avance de instalación: ${camp.instalados} de ${camp.medios} medios instalados.`],
      "Instalada": ["Campaña instalada", "Todos los medios están instalados. Reportes en preparación."],
      "En reporte": ["Reportes disponibles", `Hay ${reportes.length} reportes publicados. El último es del periodo de ${reportes[reportes.length - 1]}.`]
    };
    // Contador: instalados, si no incluidos, si no respondidos.
    let cuenta = null;
    if (camp.instalados !== undefined) cuenta = [camp.instalados, `${camp.instalados} de ${camp.medios} medios instalados`, "Medios instalados"];
    else if (camp.incluidos !== undefined) cuenta = [camp.incluidos, `${camp.incluidos} de ${camp.medios} medios incluidos`, "Medios incluidos"];
    else if (camp.respondidos !== undefined) cuenta = [camp.respondidos, `${camp.respondidos} de ${camp.medios} medios respondidos`, "Medios respondidos"];

    const vigencia = `${camp.inicio} – ${camp.fin}`;
    document.title = `${camp.nombre} · Portal OBP`;
    $id("crumbName").textContent = camp.codigo;
    $id("campName").textContent = camp.nombre;
    $id("campBadge").textContent = camp.estado;
    $id("campBadge").classList.add(badgeClass[camp.estado] || "b-neutral");
    $id("campCode").textContent = camp.codigo;
    $id("factVigencia").textContent = vigencia;
    $id("factMedios").textContent = `${camp.medios} en la propuesta`;
    $id("factAgencia").textContent = AGENCIA;

    const headCta = $id("headCta");
    headCta.textContent = camp.nextCta;
    headCta.href = faseActual.href + q;

    // Contenido de siguiente paso (solo se inserta en la fila de la fase activa).
    const paso = pasos[camp.estado] || ["", ""];
    let barra = "", contador = "";
    if (cuenta) {
      const pct = Math.round((cuenta[0] / camp.medios) * 100);
      barra = `
                  <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${escTxt(cuenta[2])}"><i style="width:${pct}%"></i></div>`;
      contador = `
                    <span>${escTxt(cuenta[1])}</span>`;
    }
    // Solo en modo demo: OBP publicaría la cotización en su sistema; aquí se simula. Solo la campaña del flujo.
    const puedeSimular = modoDemo && camp.codigo === CAMP_FLUJO && camp.estado === "Selección confirmada";
    const simularHtml = puedeSimular ? `
                  <div class="counter">
                    <button type="button" class="cta secondary" id="btnSimular">Simular publicación de cotización</button>
                  </div>` : "";
    const siguientePaso = `
                <div class="phase-next">
                  <strong>${escTxt(paso[0])}</strong>
                  <p>${escTxt(paso[1])}</p>${barra}
                  <div class="counter">${contador}
                    <a class="cta" href="${faseActual.href + q}">${escTxt(camp.nextCta)}</a>
                  </div>${simularHtml}
                </div>`;

    $id("phases").innerHTML = fases.map((f, i) => {
      const clase = faseClase(i);
      return `
              <li class="phase ${clase}"${clase === "current" ? ' aria-current="step"' : ""}>
                <span class="phase-num" aria-hidden="true">${i + 1}</span>
                <div>
                  <div class="phase-title"><span class="sr">Fase ${i + 1}: </span>${f.name}</div>
                  <div class="phase-desc">${f.desc}</div>
                  ${clase === "locked" ? `<div class="lock-note">${f.lock}</div>` : ""}
                </div>
                <span class="badge ${faseBadge[clase]}"><span class="sr">Estado: </span>${faseEstado[clase]}</span>${clase === "current" ? siguientePaso : ""}
              </li>`;
    }).join("");

    // Simular publicación: la campaña pasa a "Cotización lista" y la página se vuelve a pintar (sin ?reset).
    const btnSimular = $id("btnSimular");
    if (btnSimular) btnSimular.addEventListener("click", () => {
      OBP_ESTADO.actualizarCampana(camp.codigo, { estado: "Cotización lista" });
      const params = new URLSearchParams(location.search);
      params.delete("reset");
      location.replace(location.pathname + "?" + params.toString() + location.hash);
    });
  }

  // Arte de la campaña: carga 100% simulada (sin red ni Google Drive real).
  if ($id("artPanel")) {
    const ART_EXT = ["psd", "ai", "jpg", "jpeg", "zip", "rar"];
    const ART_MAX_MB = 200;
    const ART_ERROR = "Archivo no válido. Usa PSD, AI, JPG o ZIP/RAR de hasta 200 MB.";
    const input = $id("artInput"), drop = $id("artDrop"), err = $id("artError"), live = $id("artStatus");
    let timer = null;

    const show = (estado) => {
      $id("artEmpty").hidden = estado !== "empty";
      $id("artUploading").hidden = estado !== "uploading";
      $id("artDone").hidden = estado !== "done";
    };
    const announce = (t) => { live.textContent = t; };
    const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    const mb = (bytes) => (bytes / (1024 * 1024)).toFixed(1) + " MB";

    // Miniatura simulada 320x180 con degradado de marca (mismo estilo que el arte de Mis campañas).
    const thumb = (nombre, ext) => {
      const titulo = (camp ? camp.nombre : nombre);
      const t = titulo.length > 22 ? titulo.slice(0, 21) + "…" : titulo;
      return `
        <svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(`Miniatura del arte ${nombre}`)}">
          <defs>
            <linearGradient id="art-up-g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#3658c1"/>
              <stop offset="1" stop-color="#2d49a1"/>
            </linearGradient>
          </defs>
          <rect width="320" height="180" fill="url(#art-up-g)"/>
          <circle cx="268" cy="30" r="110" fill="#ffffff" fill-opacity=".12"/>
          <circle cx="268" cy="30" r="60" fill="#ffffff" fill-opacity=".08"/>
          <text x="20" y="96" fill="#ffffff" font-size="24" font-weight="700" font-family="inherit">${esc(t)}</text>
          <text x="20" y="162" fill="#ffffff" fill-opacity=".72" font-size="11" font-family="inherit">${esc(ext.toUpperCase())}</text>
        </svg>`;
    };

    const reset = () => {
      clearInterval(timer); clearTimeout(timer);
      input.value = "";
      err.textContent = "";
      show("empty");
    };

    const start = (file) => {
      if (!file) return;
      const ext = (file.name.split(".").pop() || "").toLowerCase();
      const valido = file.name.includes(".") && ART_EXT.includes(ext) && file.size <= ART_MAX_MB * 1024 * 1024;
      if (!valido) {
        input.value = "";
        show("empty");
        err.textContent = ART_ERROR;
        return;
      }
      err.textContent = "";
      clearInterval(timer); clearTimeout(timer);
      $id("upName").textContent = file.name;
      $id("upSize").textContent = mb(file.size);
      show("uploading");
      announce(`Subiendo ${file.name}`);
      let pct = 0;
      const pinta = () => {
        $id("upFill").style.width = pct + "%";
        $id("upBar").setAttribute("aria-valuenow", pct);
        $id("upText").textContent = `Subiendo… ${pct}%`;
      };
      pinta();
      // 0 a 100 en ~1.5 s (20 pasos de 75 ms).
      timer = setInterval(() => {
        pct = Math.min(100, pct + 5);
        pinta();
        if (pct >= 100) {
          clearInterval(timer);
          $id("upText").textContent = "Generando miniatura…";
          announce("Generando miniatura");
          timer = setTimeout(() => {
            $id("artThumb").innerHTML = thumb(file.name, ext);
            $id("artFile").textContent = `${file.name} · ${mb(file.size)}`;
            show("done");
            announce(`Arte cargado: ${file.name}`);
          }, 1000);
        }
      }, 75);
    };

    input.addEventListener("change", () => start(input.files[0]));
    ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => {
      e.preventDefault();
      drop.classList.add("over");
    }));
    ["dragleave", "dragend"].forEach((ev) => drop.addEventListener(ev, () => drop.classList.remove("over")));
    drop.addEventListener("drop", (e) => {
      e.preventDefault();
      drop.classList.remove("over");
      start(e.dataTransfer && e.dataTransfer.files[0]);
    });
    $id("artReplace").addEventListener("click", () => { input.value = ""; input.click(); });
    $id("artRemove").addEventListener("click", () => {
      reset();
      announce("Arte quitado");
      input.focus();
    });
  }

  // Maqueta: los enlaces "#" no navegan.
  document.addEventListener("click", (e) => {
    if (e.target.closest('a[href="#"]')) e.preventDefault();
  });

  // Tema (solo para revisar la maqueta; por defecto sigue el sistema)
  document.getElementById("themeBtn").addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.getAttribute("data-theme") === "dark" ||
      (!root.hasAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    root.setAttribute("data-theme", dark ? "light" : "dark");
  });
</script>
</body>
</html>
